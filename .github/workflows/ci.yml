name: ETP-00 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  planning-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validar Documento 22 no Windows PowerShell 5.1
        shell: powershell
        run: .\documentacao\validar-documento-22.ps1
      - name: Validar Documento 23 no Windows PowerShell 5.1
        shell: powershell
        run: .\documentacao\validar-documento-23.ps1
      - name: Validar Documento 22 no PowerShell 7
        shell: pwsh
        run: ./documentacao/validar-documento-22.ps1
      - name: Validar Documento 23 no PowerShell 7
        shell: pwsh
        run: ./documentacao/validar-documento-23.ps1
      - name: Impedir alteracao dos artefatos validados
        shell: pwsh
        run: |
          if (git status --porcelain) { throw 'Os validadores alteraram arquivos rastreados.' }

  code-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: portal_dp_test
          POSTGRES_USER: portal_dp_bootstrap
          POSTGRES_PASSWORD: ci-synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_dp_bootstrap -d portal_dp_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgresql://portal_dp_app_login:ci-app-synthetic-only@127.0.0.1:5432/portal_dp_test?options=-c%20role%3Dportal_dp_app
      WORKER_DATABASE_URL: postgresql://portal_dp_worker_login:ci-worker-synthetic-only@127.0.0.1:5432/portal_dp_test?options=-c%20role%3Dportal_dp_worker
      MIGRATOR_DATABASE_URL: postgresql://portal_dp_bootstrap:ci-synthetic-only@127.0.0.1:5432/portal_dp_test
      TEST_DATABASE_URL: postgresql://portal_dp_bootstrap:ci-synthetic-only@127.0.0.1:5432/portal_dp_test
      APP_DATABASE_PASSWORD: ci-app-synthetic-only
      WORKER_DATABASE_PASSWORD: ci-worker-synthetic-only
      ETP00_SYNTHETIC_PROOF_ENABLED: "true"
      PRIVATE_OBJECT_ROOT: ./tmp/private-objects/ci
      WORKER_ID: portal-dp-worker-etp00-ci
      WORKER_ACTOR_ID: 10000000-0000-4000-8000-000000000001
      WORKER_COMPANY_IDS: 00000000-0000-4000-8000-00000000000a,00000000-0000-4000-8000-00000000000b,00000000-0000-4000-8000-00000000000c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:environment
      - run: pnpm verify:asvs
      - run: pnpm test:evidence-repository
      - run: pnpm verify:asvs:gate
      - run: pnpm verify:api
      - run: pnpm format:check
      - name: SCA — vulnerabilidades de dependencias de producao
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidencias/resultados
          pnpm audit --prod --audit-level high --json \
            | tee evidencias/resultados/pnpm-audit-production.json
      - run: pnpm security:licenses
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm db:provision:service-logins
      - run: pnpm db:seed:synthetic
      - run: pnpm test:integration:database
      - run: pnpm security:sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: etp00-raw-code-and-postgres-${{ github.sha }}
          path: |
            evidencias/artefatos
            evidencias/resultados
          if-no-files-found: warn
          retention-days: 90

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Preparar evidencias SAST
        run: mkdir -p evidencias/resultados
      - name: Semgrep SAST — OWASP, Node.js e TypeScript
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --workdir /src \
            semgrep/semgrep:1.172.0-nonroot@sha256:d1012a3bf2acf47721216fbf7ff12d4c2971cc7f9c7b77cf6c6e9dcf006bd487 \
            semgrep scan \
              --config p/owasp-top-ten \
              --config p/nodejs \
              --config p/typescript \
              --severity ERROR \
              --error \
              --json \
              --exclude node_modules \
              --exclude dist \
              --exclude evidencias \
              . | tee evidencias/resultados/sast-semgrep.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: etp00-raw-sast-${{ github.sha }}
          path: evidencias/resultados/sast-semgrep.json
          if-no-files-found: warn
          retention-days: 90

  oci-image:
    needs: [planning-windows, code-and-postgres, secret-scan, sast]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: portal_dp_oci_smoke
          POSTGRES_USER: portal_dp_bootstrap
          POSTGRES_PASSWORD: ci-oci-synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_dp_bootstrap -d portal_dp_oci_smoke"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgresql://portal_dp_app_login:ci-oci-app-synthetic@127.0.0.1:5432/portal_dp_oci_smoke?options=-c%20role%3Dportal_dp_app
      WORKER_DATABASE_URL: postgresql://portal_dp_worker_login:ci-oci-worker-synthetic@127.0.0.1:5432/portal_dp_oci_smoke?options=-c%20role%3Dportal_dp_worker
      MIGRATOR_DATABASE_URL: postgresql://portal_dp_bootstrap:ci-oci-synthetic-only@127.0.0.1:5432/portal_dp_oci_smoke
      APP_DATABASE_PASSWORD: ci-oci-app-synthetic
      WORKER_DATABASE_PASSWORD: ci-oci-worker-synthetic
      ETP00_SYNTHETIC_PROOF_ENABLED: "true"
      WORKER_ID: portal-dp-worker-oci-smoke
      WORKER_ACTOR_ID: 10000000-0000-4000-8000-000000000001
      WORKER_COMPANY_IDS: 00000000-0000-4000-8000-00000000000a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preparar PostgreSQL e tarefa sintetica do smoke
        run: |
          pnpm --filter=./packages/* -r --if-present build
          pnpm db:migrate
          pnpm db:provision:service-logins
          pnpm db:seed:synthetic
          node scripts/prepare-evidence-dirs.mjs
          pnpm smoke:oci:prepare
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: portal-dp:${{ github.sha }}
          platforms: linux/amd64
          outputs: |
            type=docker,name=portal-dp:${{ github.sha }}
            type=oci,dest=/tmp/portal-dp.oci.tar
      - name: Smoke da API e do worker no mesmo artefato
        shell: bash
        run: |
          set -euo pipefail
          image="portal-dp:${GITHUB_SHA}"
          api_container="portal-dp-api-smoke"
          worker_container="portal-dp-worker-smoke"
          cleanup() {
            for container in "$api_container" "$worker_container"; do
              docker logs "$container" > "evidencias/resultados/${container}.log" 2>&1 || true
              docker inspect --format '{{json .State}}' "$container" \
                > "evidencias/resultados/${container}.state.json" 2>/dev/null || true
              docker rm --force "$container" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT

          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001"
          docker run --detach --name "$api_container" --network host \
            --env NODE_ENV=production \
            --env API_HOST=0.0.0.0 \
            --env API_PORT=3000 \
            --env DATABASE_URL \
            --env ETP00_SYNTHETIC_PROOF_ENABLED=false \
            "$image"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/health/ready \
              --output evidencias/resultados/oci-api-ready.json; then
              break
            fi
            if [ "$attempt" = 30 ]; then docker logs "$api_container"; exit 1; fi
            sleep 1
          done
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/api/v1/sessao \
            --output /dev/null
          printf '%s\n' \
            '{"verified":true,"endpoint":"/api/v1/sessao","statusCode":200}' \
            > evidencias/resultados/oci-api-session-check.json
          curl --fail --silent --show-error http://127.0.0.1:3000/ \
            --output evidencias/resultados/oci-web-index.html

          docker run --detach --name "$worker_container" --network host \
            --env NODE_ENV=test \
            --env WORKER_DATABASE_URL \
            --env ETP00_SYNTHETIC_PROOF_ENABLED=true \
            --env WORKER_ID \
            --env WORKER_ACTOR_ID \
            --env WORKER_COMPANY_IDS \
            "$image" node apps/worker/dist/main.js

          for attempt in {1..30}; do
            if docker logs "$worker_container" 2>&1 | grep --quiet '"event":"outbox_completed"'; then
              break
            fi
            if [ "$attempt" = 30 ]; then docker logs "$worker_container"; exit 1; fi
            sleep 1
          done
          company_id="$(node -p "JSON.parse(require('fs').readFileSync('evidencias/resultados/oci-smoke-task.json','utf8')).companyId")"
          object_id="$(node -p "JSON.parse(require('fs').readFileSync('evidencias/resultados/oci-smoke-task.json','utf8')).privateObjectId")"
          docker exec "$worker_container" test -r \
            "/var/lib/portal-dp/private-objects/${company_id}/${object_id}.bin"
          pnpm smoke:oci:verify | tee evidencias/resultados/oci-worker-verification.json
      - name: Trivy — vulnerabilidades criticas/altas da imagem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: portal-dp:${{ github.sha }}
          format: json
          output: evidencias/resultados/trivy-image.json
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          hide-progress: true
      - name: Trivy — configuracao e Dockerfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: json
          output: evidencias/resultados/trivy-config.json
          exit-code: "1"
          severity: CRITICAL,HIGH
          hide-progress: true
      - name: Registrar digest do mesmo artefato
        run: |
          cp /tmp/portal-dp.oci.tar evidencias/artefatos/portal-dp.oci.tar
          sha256sum evidencias/artefatos/portal-dp.oci.tar \
            | tee evidencias/resultados/portal-dp.oci.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: etp00-raw-oci-${{ github.sha }}
          path: |
            evidencias/artefatos
            evidencias/resultados
          if-no-files-found: warn
          retention-days: 90

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2

  evidence-repository:
    if: ${{ always() }}
    needs: [planning-windows, code-and-postgres, secret-scan, sast, oci-image]
    runs-on: ubuntu-latest
    env:
      EVIDENCE_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_SOURCE_DIR: evidencias/coleta
      EVIDENCE_OUTPUT_DIR: evidencias/repositorio
      EVIDENCE_BINDINGS: evidencias/manifests/evidence-bindings-etp00-v1.json
      EVIDENCE_RESPONSIBLE_ROLE: AUTOMACAO_ETP00
      EVIDENCE_RETENTION_DAYS: "90"
      EVIDENCE_JOB_RESULTS_JSON: >-
        {"planning-windows":"${{ needs.planning-windows.result }}","code-and-postgres":"${{ needs.code-and-postgres.result }}","secret-scan":"${{ needs.secret-scan.result }}","sast":"${{ needs.sast.result }}","oci-image":"${{ needs.oci-image.result }}"}
      EVIDENCE_METADATA_JSON: >-
        {"event":"${{ github.event_name }}","runNumber":"${{ github.run_number }}"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reunir evidencias brutas da execucao
        id: raw-evidence-download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: etp00-raw-*
          path: evidencias/coleta
      - name: Registrar contexto sanitizado da execucao
        if: ${{ always() }}
        env:
          EVIDENCE_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.raw-evidence-download.outcome }}
        run: node scripts/write-evidence-run-context.mjs
      - name: Selar e verificar o manifesto imutavel
        env:
          EVIDENCE_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.raw-evidence-download.outcome }}
        run: |
          node scripts/finalize-evidence-run.mjs
          node scripts/validate-evidence-run.mjs \
            --manifest "evidencias/repositorio/runs/${EVIDENCE_RUN_ID}/manifest.json"
          node scripts/validate-evidence-run.mjs \
            --manifest "evidencias/repositorio/runs/${EVIDENCE_RUN_ID}/manifest.json" \
            --require-complete
      - name: Publicar repositorio selado da execucao
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: etp00-evidence-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidencias/repositorio/runs/${{ env.EVIDENCE_RUN_ID }}
          if-no-files-found: error
          retention-days: 90
