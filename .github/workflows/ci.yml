name: ETP-00 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: etp00-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Falha cedo se alguma acao JavaScript ainda nao for compativel com o runtime atual.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  planning-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validar Documento 22 no Windows PowerShell 5.1
        shell: powershell
        run: .\documentacao\validar-documento-22.ps1
      - name: Validar Documento 23 no Windows PowerShell 5.1
        shell: powershell
        run: .\documentacao\validar-documento-23.ps1
      - name: Validar Documento 22 no PowerShell 7
        shell: pwsh
        run: ./documentacao/validar-documento-22.ps1
      - name: Validar Documento 23 no PowerShell 7
        shell: pwsh
        run: ./documentacao/validar-documento-23.ps1
      - name: Impedir alteracao dos artefatos validados
        shell: pwsh
        run: |
          if (git status --porcelain) { throw 'Os validadores alteraram arquivos rastreados.' }

  code-and-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
        env:
          POSTGRES_DB: portal_dp_test
          POSTGRES_USER: portal_dp_bootstrap
          POSTGRES_PASSWORD: ci-synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_dp_bootstrap -d portal_dp_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgresql://portal_dp_app_login:ci-app-synthetic-only@127.0.0.1:5432/portal_dp_test?options=-c%20role%3Dportal_dp_app
      WORKER_DATABASE_URL: postgresql://portal_dp_worker_login:ci-worker-synthetic-only@127.0.0.1:5432/portal_dp_test?options=-c%20role%3Dportal_dp_worker
      MIGRATOR_DATABASE_URL: postgresql://portal_dp_bootstrap:ci-synthetic-only@127.0.0.1:5432/portal_dp_test
      TEST_DATABASE_URL: postgresql://portal_dp_bootstrap:ci-synthetic-only@127.0.0.1:5432/portal_dp_test
      APP_DATABASE_PASSWORD: ci-app-synthetic-only
      WORKER_DATABASE_PASSWORD: ci-worker-synthetic-only
      ETP00_SYNTHETIC_PROOF_ENABLED: "true"
      PRIVATE_OBJECT_ROOT: ./tmp/private-objects/ci
      WORKER_ID: portal-dp-worker-etp00-ci
      WORKER_ACTOR_ID: 10000000-0000-4000-8000-000000000001
      WORKER_COMPANY_IDS: 00000000-0000-4000-8000-00000000000a,00000000-0000-4000-8000-00000000000b,00000000-0000-4000-8000-00000000000c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:environment
      - run: pnpm verify:asvs
      - run: pnpm test:evidence-repository
      - run: pnpm verify:asvs:applicability
      - run: pnpm verify:api
      - run: pnpm format:check
      - name: SCA — vulnerabilidades de dependencias de producao
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidencias/resultados
          pnpm audit --prod --audit-level high --json \
            | tee evidencias/resultados/pnpm-audit-production.json
      - run: pnpm security:licenses
      - run: pnpm typecheck
      - name: Testes unitarios com relatorio preservado
        shell: bash
        run: |
          set -euo pipefail
          pnpm test:unit | tee evidencias/resultados/unit-tests.log
          printf '\nETP00_UNIT_TEST_COMMAND_STATUS=PASSOU\n' \
            | tee -a evidencias/resultados/unit-tests.log
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm db:provision:service-logins
      - run: pnpm db:seed:synthetic
      - run: pnpm test:integration:database
      - run: pnpm verify:gat02-report
      - run: pnpm security:sbom
      - name: Varrer build, fixtures e evidencias antes de qualquer upload
        id: generated-secret-scan
        if: ${{ always() }}
        continue-on-error: true
        env:
          GENERATED_SECRET_SCAN_PROFILE: GENERATED
          GENERATED_SECRET_SCAN_OUTPUT_PATH: evidencias/resumos-seguranca/content-secret-scan-generated.json
        shell: bash
        run: |
          bash scripts/run-content-secret-scan.sh \
            --scope BUILD_PACKAGE=apps/api/dist \
            --scope BUILD_PACKAGE=apps/web/dist \
            --scope BUILD_PACKAGE=apps/worker/dist \
            --scope BUILD_PACKAGE=packages/contracts/dist \
            --scope BUILD_PACKAGE=packages/database/dist \
            --scope BUILD_PACKAGE=packages/domain/dist \
            --scope BUILD_PACKAGE=packages/integrations/dist \
            --scope BUILD_PACKAGE=packages/observability/dist \
            --scope BUILD_PACKAGE=packages/storage/dist \
            --scope BUILD_PACKAGE=packages/testing/dist \
            --scope TEST_FIXTURES=database/seeds \
            --scope TEST_FIXTURES=packages/testing/src \
            --scope TEST_FIXTURES=packages/testing/tests \
            --scope TEST_FIXTURES=tests \
            --scope GENERATED_EVIDENCE=evidencias/artefatos \
            --scope GENERATED_EVIDENCE=evidencias/resultados
      - name: Preservar somente o resumo sanitizado da varredura gerada
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: etp00-raw-generated-secret-scan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidencias/resumos-seguranca/content-secret-scan-generated.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && steps.generated-secret-scan.outputs.passed == 'true' }}
        with:
          name: etp00-raw-code-and-postgres-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidencias/artefatos
            evidencias/resultados
          if-no-files-found: warn
          retention-days: 90
      - name: Reprovar build, fixtures ou evidencias com conteudo proibido
        if: ${{ always() && steps.generated-secret-scan.outputs.passed != 'true' }}
        run: exit 1

  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Preparar evidencias SAST
        run: mkdir -p evidencias/resultados
      - name: Semgrep SAST — OWASP, Node.js e TypeScript
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check security/semgrep/registry-snapshots/SHA256SUMS
          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --workdir /src \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env HOME=/tmp/semgrep-home \
            --env SEMGREP_SEND_METRICS=off \
            --env SEMGREP_SETTINGS_FILE=/tmp/semgrep-settings.yml \
            --env SEMGREP_VERSION_CACHE_PATH=/tmp/semgrep-version-cache \
            semgrep/semgrep:1.172.0-nonroot@sha256:d1012a3bf2acf47721216fbf7ff12d4c2971cc7f9c7b77cf6c6e9dcf006bd487 \
            semgrep scan \
              --config security/semgrep/registry-snapshots/owasp-top-ten.json \
              --config security/semgrep/registry-snapshots/nodejs.json \
              --config security/semgrep/registry-snapshots/typescript.json \
              --severity ERROR \
              --error \
              --metrics off \
              --json \
              --exclude node_modules \
              --exclude dist \
              --exclude evidencias \
              --exclude security/semgrep/registry-snapshots \
              . > evidencias/resultados/sast-semgrep.raw.json
          semgrep_status="$?"
          set -e
          node scripts/finalize-semgrep-report.mjs
          rm -f -- evidencias/resultados/sast-semgrep.raw.json
          exit "$semgrep_status"
      - name: Varrer a evidencia SAST antes de publica-la
        id: sast-evidence-secret-scan
        if: ${{ always() }}
        continue-on-error: true
        env:
          GENERATED_SECRET_SCAN_PROFILE: SAST_EVIDENCE
          GENERATED_SECRET_SCAN_OUTPUT_PATH: evidencias/resumos-seguranca/content-secret-scan-sast-evidence.json
        shell: bash
        run: >-
          bash scripts/run-content-secret-scan.sh
          --scope SAST_EVIDENCE=evidencias/resultados
      - name: Preservar resumo sanitizado da varredura SAST
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: etp00-raw-sast-secret-scan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidencias/resumos-seguranca/content-secret-scan-sast-evidence.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && steps.sast-evidence-secret-scan.outputs.passed == 'true' }}
        with:
          name: etp00-raw-sast-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidencias/resultados/sast-semgrep.json
          if-no-files-found: warn
          retention-days: 90
      - name: Reprovar evidencia SAST com conteudo proibido
        if: ${{ always() && steps.sast-evidence-secret-scan.outputs.passed != 'true' }}
        run: exit 1

  oci-image:
    needs: [planning-windows, code-and-postgres, secret-scan, sast]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
        env:
          POSTGRES_DB: portal_dp_oci_smoke
          POSTGRES_USER: portal_dp_bootstrap
          POSTGRES_PASSWORD: ci-oci-synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_dp_bootstrap -d portal_dp_oci_smoke"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgresql://portal_dp_app_login:ci-oci-app-synthetic@127.0.0.1:5432/portal_dp_oci_smoke?options=-c%20role%3Dportal_dp_app
      WORKER_DATABASE_URL: postgresql://portal_dp_worker_login:ci-oci-worker-synthetic@127.0.0.1:5432/portal_dp_oci_smoke?options=-c%20role%3Dportal_dp_worker
      MIGRATOR_DATABASE_URL: postgresql://portal_dp_bootstrap:ci-oci-synthetic-only@127.0.0.1:5432/portal_dp_oci_smoke
      APP_DATABASE_PASSWORD: ci-oci-app-synthetic
      WORKER_DATABASE_PASSWORD: ci-oci-worker-synthetic
      ETP00_SYNTHETIC_PROOF_ENABLED: "true"
      WORKER_ID: portal-dp-worker-oci-smoke
      WORKER_ACTOR_ID: 10000000-0000-4000-8000-000000000001
      WORKER_COMPANY_IDS: 00000000-0000-4000-8000-00000000000a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Preparar PostgreSQL e tarefa sintetica do smoke
        run: |
          pnpm --filter=./packages/* -r --if-present build
          pnpm db:migrate
          pnpm db:provision:service-logins
          pnpm db:seed:synthetic
          node scripts/prepare-evidence-dirs.mjs
          pnpm smoke:oci:prepare
      - id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Registrar toolchain de build sanitizada
        env:
          BUILDX_DRIVER: ${{ steps.buildx.outputs.driver }}
          BUILDX_NODES_JSON: ${{ steps.buildx.outputs.nodes }}
        run: node scripts/write-build-toolchain-verification.mjs
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          # O pacote de evidências explícito abaixo é a fonte controlada. O
          # build record implícito poderia reter metadados fora desse pacote.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: Dockerfile
          push: false
          provenance: mode=max,version=v1,builder-id=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # O gerador tambem fica imutavel; a atualizacao exige revisao explicita.
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
          tags: portal-dp:${{ github.sha }}
          platforms: linux/amd64
          outputs: type=oci,dest=/tmp/portal-dp.oci.tar
      - name: Carregar a imagem executavel vinculada ao artefato OCI
        id: runtime-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          # A imagem local reutiliza a mesma construcao, mas sem anexos. O
          # vinculo criptografico com o OCI e validado no passo seguinte.
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: Dockerfile
          push: false
          load: true
          provenance: false
          sbom: false
          tags: portal-dp:${{ github.sha }}
          platforms: linux/amd64
      - name: Vincular os scanners ao ImageID carregado localmente
        id: local-image
        env:
          OCI_BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          OCI_BUILD_METADATA_JSON: ${{ steps.build.outputs.metadata }}
          OCI_EXPECTED_BUILDER_ID: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OCI_RUNTIME_DIGEST: ${{ steps.runtime-image.outputs.digest }}
          OCI_RUNTIME_IMAGE_ID: ${{ steps.runtime-image.outputs.imageid }}
          OCI_RUNTIME_METADATA_JSON: ${{ steps.runtime-image.outputs.metadata }}
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(docker image inspect \
            --format '{{.Id}}' "portal-dp:${GITHUB_SHA}")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          export OCI_LOCAL_IMAGE_ID="$image_id"
          node scripts/write-oci-build-evidence.mjs /tmp/portal-dp.oci.tar
          printf 'image-id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
      - name: Smoke da API e do worker no mesmo artefato
        shell: bash
        run: |
          set -euo pipefail
          image="portal-dp:${GITHUB_SHA}"
          api_container="portal-dp-api-smoke"
          worker_container="portal-dp-worker-smoke"
          cleanup() {
            for container in "$api_container" "$worker_container"; do
              docker logs "$container" > "evidencias/resultados/${container}.log" 2>&1 || true
              docker rm --force --volumes "$container" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT

          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "65532:65532"
          docker run --detach --name "$api_container" --network host \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            --env NODE_ENV=production \
            --env API_HOST=0.0.0.0 \
            --env API_PORT=3000 \
            --env DATABASE_URL \
            --env ETP00_SYNTHETIC_PROOF_ENABLED=false \
            "$image"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/health/ready \
              --output evidencias/resultados/oci-api-ready.json; then
              break
            fi
            if [ "$attempt" = 30 ]; then docker logs "$api_container"; exit 1; fi
            sleep 1
          done
          session_status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            http://127.0.0.1:3000/api/v1/sessao)"
          test "$session_status" = "200"
          printf \
            '{"verified":true,"endpoint":"/api/v1/sessao","statusCode":%s}\n' \
            "$session_status" \
            > evidencias/resultados/oci-api-session-check.json
          curl --fail --silent --show-error http://127.0.0.1:3000/ \
            --output evidencias/resultados/oci-web-index.html

          docker run --detach --name "$worker_container" --network host \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount type=volume,destination=/var/lib/portal-dp/private-objects \
            --cap-drop ALL --security-opt no-new-privileges \
            --env NODE_ENV=test \
            --env WORKER_DATABASE_URL \
            --env ETP00_SYNTHETIC_PROOF_ENABLED=true \
            --env WORKER_ID \
            --env WORKER_ACTOR_ID \
            --env WORKER_COMPANY_IDS \
            "$image" apps/worker/dist/main.js

          for attempt in {1..30}; do
            if docker logs "$worker_container" 2>&1 | grep --quiet '"event":"outbox_completed"'; then
              break
            fi
            if [ "$attempt" = 30 ]; then docker logs "$worker_container"; exit 1; fi
            sleep 1
          done
          company_id="$(node -p "JSON.parse(require('fs').readFileSync('evidencias/resultados/oci-smoke-task.json','utf8')).companyId")"
          object_id="$(node -p "JSON.parse(require('fs').readFileSync('evidencias/resultados/oci-smoke-task.json','utf8')).privateObjectId")"
          copied_object_directory="$(mktemp -d)"
          docker cp \
            "$worker_container:/var/lib/portal-dp/private-objects/${company_id}/${object_id}.bin" \
            "$copied_object_directory/object.bin"
          test -s "$copied_object_directory/object.bin"
          rm -rf -- "$copied_object_directory"
          pnpm smoke:oci:verify | tee evidencias/resultados/oci-worker-verification.json

          # A requisicao atravessa as protecoes de origem e CSRF para provar o
          # 404 produzido pelo proprio controller desabilitado em producao.
          session_body="$(mktemp)"
          session_headers="$(mktemp)"
          curl --fail --silent --show-error \
            --dump-header "$session_headers" \
            --output "$session_body" \
            http://127.0.0.1:3000/api/v1/sessao
          csrf_token="$(node -p \
            "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).data.csrf_token" \
            "$session_body")"
          csrf_cookie="$(node -e \
            "const h=require('fs').readFileSync(process.argv[1],'utf8'); const m=h.match(/^set-cookie:\\s*([^;]+)/im); if(!m) process.exit(1); process.stdout.write(m[1]);" \
            "$session_headers")"
          synthetic_route_status="$(curl --silent --show-error \
            --request PATCH \
            --header 'Origin: http://localhost:5173' \
            --header "Cookie: $csrf_cookie" \
            --header "X-CSRF-Token: $csrf_token" \
            --output /dev/null \
            --write-out '%{http_code}' \
            http://127.0.0.1:3000/api/v1/etp00/provas-sinteticas/00000000-0000-4000-8000-000000000000)"
          rm -f -- "$session_body" "$session_headers"
          node scripts/write-security-configuration-verification.mjs \
            --user "$(docker image inspect --format '{{.Config.User}}' "$image")" \
            --read-only "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$api_container")" \
            --cap-drop "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$api_container")" \
            --security-options "$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$api_container")" \
            --worker-user "$(docker inspect --format '{{.Config.User}}' "$worker_container")" \
            --worker-read-only "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$worker_container")" \
            --worker-cap-drop "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$worker_container")" \
            --worker-security-options "$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$worker_container")" \
            --synthetic-route-status "$synthetic_route_status" \
            --runtime-base "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.base.name"}}' "$image")" \
            --entrypoint "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$image")" \
            --command "$(docker image inspect --format '{{json .Config.Cmd}}' "$image")" \
            --image-declared-volumes "$(docker image inspect --format '{{json .Config.Volumes}}' "$image")" \
            --api-mounts "$(docker inspect --format '{{json .Mounts}}' "$api_container")" \
            --worker-mounts "$(docker inspect --format '{{json .Mounts}}' "$worker_container")" \
            --private-root-permissions "$(docker exec "$worker_container" /nodejs/bin/node -e 'const fs=require("fs");const s=fs.statSync(process.argv[1]);process.stdout.write(`${s.uid}:${s.gid}:${(s.mode&0o777).toString(8)}`)' /var/lib/portal-dp/private-objects)" \
            --private-object-permissions "$(docker exec "$worker_container" /nodejs/bin/node -e 'const fs=require("fs");const s=fs.statSync(process.argv[1]);process.stdout.write(`${s.uid}:${s.gid}:${(s.mode&0o777).toString(8)}`)' "/var/lib/portal-dp/private-objects/${company_id}/${object_id}.bin")"
      - name: Fixar politica Trivy sem ignores ou exclusoes herdadas
        id: trivy-policy
        run: >-
          node scripts/prepare-trivy-policy.mjs
          --root .
          --output-directory "${RUNNER_TEMP}/portal-dp-trivy"
      - name: Trivy — vulnerabilidades criticas/altas da imagem
        id: trivy-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: portal-dp:${{ github.sha }}
          scanners: vuln
          # Mantem cobertura verificavel mesmo quando nao ha vulnerabilidades.
          list-all-pkgs: "true"
          trivy-config: ${{ runner.temp }}/portal-dp-trivy/trivy.yaml
          trivyignores: ${{ runner.temp }}/portal-dp-trivy/.trivyignore
          format: json
          output: ${{ runner.temp }}/trivy-image.raw.json
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL,HIGH
          hide-progress: true
      - name: Trivy — configuracao e Dockerfile
        id: trivy-config
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: config
          scan-ref: .
          scanners: misconfig
          trivy-config: ${{ runner.temp }}/portal-dp-trivy/trivy.yaml
          trivyignores: ${{ runner.temp }}/portal-dp-trivy/.trivyignore
          format: json
          output: ${{ runner.temp }}/trivy-config.raw.json
          exit-code: "1"
          severity: CRITICAL,HIGH
          hide-progress: true
      - name: Resumir Trivy e liberar relatorios somente quando aprovados
        id: trivy-summary
        if: ${{ always() }}
        env:
          TRIVY_SCAN_IMAGE_REPORT_PATH: ${{ runner.temp }}/trivy-image.raw.json
          TRIVY_SCAN_CONFIG_REPORT_PATH: ${{ runner.temp }}/trivy-config.raw.json
          TRIVY_SCAN_EXPECTED_IMAGE: portal-dp:${{ github.sha }}
          TRIVY_SCAN_EXPECTED_IMAGE_ID: ${{ steps.local-image.outputs.image-id }}
          TRIVY_SCAN_EXPECTED_CONFIG_COMMIT: ${{ github.sha }}
          TRIVY_SCAN_OCI_BUILD_LINK_PATH: evidencias/resultados/oci-build-link.json
          TRIVY_SCAN_IMAGE_STEP_OUTCOME: ${{ steps.trivy-image.outcome }}
          TRIVY_SCAN_CONFIG_STEP_OUTCOME: ${{ steps.trivy-config.outcome }}
          TRIVY_SCAN_OUTPUT_PATH: evidencias/resumos-seguranca/trivy-scan-result.json
          TRIVY_SCAN_APPROVED_IMAGE_PATH: evidencias/resultados/trivy-image.json
          TRIVY_SCAN_APPROVED_CONFIG_PATH: evidencias/resultados/trivy-config.json
        run: node scripts/write-trivy-scan-result.mjs
      - name: Trivy — segredos no filesystem e nas camadas da imagem real
        id: trivy-image-secrets
        if: ${{ always() && steps.trivy-policy.outcome == 'success' && steps.build.outcome == 'success' && steps.runtime-image.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          cache: false
          image-ref: portal-dp:${{ github.sha }}
          scanners: secret
          trivy-config: ${{ runner.temp }}/portal-dp-trivy/trivy.yaml
          trivyignores: ${{ runner.temp }}/portal-dp-trivy/.trivyignore
          format: json
          output: ${{ runner.temp }}/trivy-image-secrets.json
          exit-code: "1"
          hide-progress: true
      - name: Reduzir a varredura da imagem a um resumo sem conteudo sensivel
        id: image-secret-summary
        if: ${{ always() }}
        env:
          IMAGE_SECRET_SCAN_STEP_OUTCOME: ${{ steps.trivy-image-secrets.outcome }}
          IMAGE_SECRET_SCAN_REPORT_PATH: ${{ runner.temp }}/trivy-image-secrets.json
          IMAGE_SECRET_SCAN_EXPECTED_IMAGE: portal-dp:${{ github.sha }}
          IMAGE_SECRET_SCAN_EXPECTED_IMAGE_ID: ${{ steps.local-image.outputs.image-id }}
          IMAGE_SECRET_SCAN_OUTPUT_PATH: evidencias/resumos-seguranca/image-secret-scan-result.json
        run: node scripts/write-image-secret-scan-result.mjs
      - name: Registrar digest do mesmo artefato
        run: |
          cp /tmp/portal-dp.oci.tar evidencias/artefatos/portal-dp.oci.tar
          sha256sum evidencias/artefatos/portal-dp.oci.tar \
            | tee evidencias/resultados/portal-dp.oci.sha256
      - name: Varrer artefatos e evidencias OCI antes de publica-los
        id: oci-evidence-secret-scan
        if: ${{ always() }}
        continue-on-error: true
        env:
          GENERATED_SECRET_SCAN_PROFILE: OCI_EVIDENCE
          GENERATED_SECRET_SCAN_OUTPUT_PATH: evidencias/resumos-seguranca/content-secret-scan-oci-evidence.json
        shell: bash
        run: |
          bash scripts/run-content-secret-scan.sh \
            --scope OCI_EVIDENCE=evidencias/artefatos \
            --scope OCI_EVIDENCE=evidencias/resultados
      - name: Preservar somente resumos sanitizados dos scans OCI
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: etp00-raw-oci-secret-scans-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidencias/resumos-seguranca/content-secret-scan-oci-evidence.json
            evidencias/resumos-seguranca/image-secret-scan-result.json
            evidencias/resumos-seguranca/trivy-scan-result.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && steps.trivy-summary.outputs.passed == 'true' && steps.image-secret-summary.outputs.passed == 'true' && steps.oci-evidence-secret-scan.outputs.passed == 'true' }}
        with:
          name: etp00-raw-oci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidencias/artefatos
            evidencias/resultados
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
      - name: Reprovar imagem ou evidencia OCI com segredo ou dado proibido
        if: ${{ always() && (steps.trivy-summary.outputs.passed != 'true' || steps.image-secret-summary.outputs.passed != 'true' || steps.oci-evidence-secret-scan.outputs.passed != 'true') }}
        run: exit 1

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar Gitleaks oficial com integridade verificada
        id: install-gitleaks
        continue-on-error: true
        env:
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          bin_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' "${GITLEAKS_ARCHIVE_SHA256}" "${archive}" \
            | sha256sum --check --strict
          mkdir -p "${bin_dir}"
          tar --extract --gzip --file "${archive}" \
            --directory "${bin_dir}" gitleaks
          installed_version="$("${bin_dir}/gitleaks" version)"
          test "${installed_version}" = "8.30.1"
          printf 'Gitleaks %s com integridade verificada.\n' "${installed_version}"
      - name: Varrer todo o historico Git sem publicar achados brutos
        id: gitleaks
        if: ${{ steps.install-gitleaks.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          repository_is_shallow="$(git rev-parse --is-shallow-repository 2>/dev/null)"
          scope_status=$?
          repository_commit_count="$(git rev-list --all --count 2>/dev/null)"
          scope_status=$((scope_status + $?))

          if [ "${scope_status}" -ne 0 ] || \
             [ "${repository_is_shallow}" != "false" ] || \
             ! [[ "${repository_commit_count}" =~ ^[1-9][0-9]*$ ]]; then
            scan_exit_code=90
          elif [ -e .gitleaks.toml ] || [ -e .gitleaksignore ] || \
               [ -n "${GITLEAKS_CONFIG:-}" ] || \
               [ -n "${GITLEAKS_CONFIG_TOML:-}" ]; then
            scan_exit_code=91
          else
            mkdir -p "${RUNNER_TEMP}/gitleaks-empty-ignore"
            set -o pipefail
            timeout --signal=TERM --kill-after=15s 300s \
              git log -p -U0 --full-history --all --diff-filter=tuxdb \
                2> "${RUNNER_TEMP}/gitleaks-git-log.stderr" \
              | node scripts/forward-counted-stream.mjs \
                  "${RUNNER_TEMP}/gitleaks-stream-bytes.txt" \
              | timeout --signal=TERM --kill-after=15s 300s \
                  "${RUNNER_TEMP}/gitleaks-bin/gitleaks" stdin \
                --no-banner \
                --log-level error \
                --redact=100 \
                --exit-code 2 \
                --max-decode-depth 2 \
                --ignore-gitleaks-allow \
                --gitleaks-ignore-path "${RUNNER_TEMP}/gitleaks-empty-ignore" \
                --report-format sarif \
                --report-path "${RUNNER_TEMP}/gitleaks-results.sarif"
            scan_exit_code=$?
            set +o pipefail

            if { [ "${scan_exit_code}" -eq 0 ] || \
                 [ "${scan_exit_code}" -eq 2 ]; } && \
               [ ! -s "${RUNNER_TEMP}/gitleaks-git-log.stderr" ] && \
               [ -f "${RUNNER_TEMP}/gitleaks-stream-bytes.txt" ]; then
              git_stream_bytes="$(tr -d '\r\n' \
                < "${RUNNER_TEMP}/gitleaks-stream-bytes.txt")"
              if [[ "${git_stream_bytes}" =~ ^[1-9][0-9]*$ ]]; then
                printf 'isShallow=%s\ncommitCount=%s\nstreamBytes=%s\n' \
                  "${repository_is_shallow}" "${repository_commit_count}" \
                  "${git_stream_bytes}" \
                  > "${RUNNER_TEMP}/gitleaks-scope.txt"
              else
                scan_exit_code=92
              fi
            elif [ "${scan_exit_code}" -eq 0 ] || \
                 [ "${scan_exit_code}" -eq 2 ]; then
              scan_exit_code=92
            fi
          fi
          set -e
          printf '%s\n' "${scan_exit_code}" \
            > "${RUNNER_TEMP}/gitleaks-exit-code.txt"
          exit "${scan_exit_code}"
      - name: Registrar resultado redigido da varredura
        id: secret-scan-evidence
        if: ${{ always() }}
        env:
          SECRET_SCAN_INSTALL_OUTCOME: ${{ steps.install-gitleaks.outcome }}
          SECRET_SCAN_STEP_OUTCOME: ${{ steps.gitleaks.outcome }}
          SECRET_SCAN_EXIT_CODE_PATH: ${{ runner.temp }}/gitleaks-exit-code.txt
          SECRET_SCAN_REPORT_PATH: ${{ runner.temp }}/gitleaks-results.sarif
          SECRET_SCAN_SCOPE_PATH: ${{ runner.temp }}/gitleaks-scope.txt
          SECRET_SCAN_STREAM_COUNT_PATH: ${{ runner.temp }}/gitleaks-stream-bytes.txt
          SECRET_SCAN_GIT_STDERR_PATH: ${{ runner.temp }}/gitleaks-git-log.stderr
        run: node scripts/write-secret-scan-result.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: etp00-raw-secret-scan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidencias/resultados/gitleaks-result.json
          if-no-files-found: error
          retention-days: 90
      - name: Reprovar se a varredura de segredos nao foi aprovada
        if: ${{ always() && steps.secret-scan-evidence.outputs.passed != 'true' }}
        run: exit 1

  evidence-repository:
    if: ${{ always() }}
    needs: [planning-windows, code-and-postgres, secret-scan, sast, oci-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EVIDENCE_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_SOURCE_DIR: evidencias/coleta
      EVIDENCE_OUTPUT_DIR: evidencias/repositorio
      EVIDENCE_BINDINGS: evidencias/manifests/evidence-bindings-etp00-v1.json
      EVIDENCE_RESPONSIBLE_ROLE: AUTOMACAO_ETP00
      EVIDENCE_RETENTION_DAYS: "90"
      # O repositorio atual e publico. Somente artefatos previamente
      # sanitizados podem chegar ao transporte do GitHub Actions.
      EVIDENCE_CLASSIFICATION: PUBLICO_SANITIZADO
      EVIDENCE_ACL_ENFORCEMENT: GITHUB_PUBLIC_REPOSITORY_ACTIONS_ARTIFACT_VISIBILITY
      EVIDENCE_ACL_READERS: public:github-repository-readers
      EVIDENCE_JOB_RESULTS_JSON: >-
        {"planning-windows":"${{ needs.planning-windows.result }}","code-and-postgres":"${{ needs.code-and-postgres.result }}","secret-scan":"${{ needs.secret-scan.result }}","sast":"${{ needs.sast.result }}","oci-image":"${{ needs.oci-image.result }}"}
      EVIDENCE_METADATA_JSON: >-
        {"event":"${{ github.event_name }}","runNumber":"${{ github.run_number }}","githubRunId":"${{ github.run_id }}","githubRunAttempt":"${{ github.run_attempt }}","runUrl":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reunir evidencias brutas da execucao
        id: raw-evidence-download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: etp00-raw-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidencias/coleta
      - name: Registrar contexto sanitizado da execucao
        if: ${{ always() }}
        env:
          EVIDENCE_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.raw-evidence-download.outcome }}
        run: node scripts/write-evidence-run-context.mjs
      - name: Varrer toda a coleta antes de sela-la
        id: collected-evidence-secret-scan
        if: ${{ always() }}
        continue-on-error: true
        env:
          GENERATED_SECRET_SCAN_PROFILE: COLLECTED_EVIDENCE
          GENERATED_SECRET_SCAN_OUTPUT_PATH: evidencias/coleta/_sanitized/content-secret-scan-collected-evidence.json
        shell: bash
        run: >-
          bash scripts/run-content-secret-scan.sh
          --scope COLLECTED_EVIDENCE=evidencias/coleta
      - name: Preservar sempre o resumo sanitizado da coleta
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: etp00-collected-secret-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidencias/coleta/_sanitized/content-secret-scan-collected-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Selar e verificar o manifesto imutavel
        id: seal-evidence
        if: ${{ always() && steps.collected-evidence-secret-scan.outputs.passed == 'true' }}
        env:
          EVIDENCE_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.raw-evidence-download.outcome }}
        run: |
          node scripts/finalize-evidence-run.mjs
          node scripts/validate-evidence-run.mjs \
            --preservation-structure-only \
            --bindings "$EVIDENCE_BINDINGS" \
            --manifest "evidencias/repositorio/runs/${EVIDENCE_RUN_ID}/manifest.json"
      - name: Varrer o pacote selado antes da publicacao final
        id: sealed-evidence-secret-scan
        if: ${{ always() && steps.seal-evidence.outcome == 'success' }}
        continue-on-error: true
        env:
          GENERATED_SECRET_SCAN_PROFILE: SEALED_EVIDENCE
          GENERATED_SECRET_SCAN_OUTPUT_PATH: ${{ runner.temp }}/content-secret-scan-sealed-evidence.json
          GENERATED_SECRET_SCAN_SUBJECT_MANIFEST_PATH: evidencias/repositorio/runs/${{ env.EVIDENCE_RUN_ID }}/manifest.json
        shell: bash
        run: >-
          bash scripts/run-content-secret-scan.sh
          --scope SEALED_EVIDENCE=evidencias/repositorio/runs/${EVIDENCE_RUN_ID}
      - name: Validar vinculo do recibo final ao manifesto e ao pacote
        id: sealed-evidence-receipt-contract
        if: ${{ always() && steps.sealed-evidence-secret-scan.outcome != 'skipped' }}
        run: |
          node scripts/validate-sealed-evidence-scan-receipt.mjs \
            --manifest "evidencias/repositorio/runs/${EVIDENCE_RUN_ID}/manifest.json" \
            --receipt "${RUNNER_TEMP}/content-secret-scan-sealed-evidence.json"
      - name: Preservar o resumo sanitizado da verificacao final
        if: ${{ always() && steps.sealed-evidence-receipt-contract.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: etp00-sealed-secret-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/content-secret-scan-sealed-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Publicar repositorio selado da execucao
        if: ${{ always() && steps.seal-evidence.outcome == 'success' && steps.sealed-evidence-receipt-contract.outputs.passed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: etp00-evidence-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidencias/repositorio/runs/${{ env.EVIDENCE_RUN_ID }}
          if-no-files-found: error
          retention-days: 90
      - name: Aplicar gate tecnico depois da preservacao segura
        if: ${{ always() && steps.seal-evidence.outcome == 'success' && steps.sealed-evidence-receipt-contract.outputs.passed == 'true' }}
        run: |
          node scripts/validate-evidence-run.mjs \
            --require-technical-complete \
            --bindings "$EVIDENCE_BINDINGS" \
            --manifest "evidencias/repositorio/runs/${EVIDENCE_RUN_ID}/manifest.json"
      - name: Reprovar coleta ou pacote selado com conteudo proibido
        if: ${{ always() && (steps.collected-evidence-secret-scan.outputs.passed != 'true' || (steps.seal-evidence.outcome == 'success' && steps.sealed-evidence-receipt-contract.outputs.passed != 'true')) }}
        run: exit 1
